<!DOCTYPE html>

  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
  <div class="paper-grain"></div>
  <div class="shell layer">
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="brand" href="../">
          <span class="brand__mark">e-workspace</span>
          <span class="brand__dot">·</span>
          <span class="brand__sub">jeekeagle</span>
        </a>
        <nav class="nav" aria-label="primary">
          <a href="../#/" data-view="home">Home</a>
          <a href="../#/posts" data-view="posts">Posts</a>
          <a href="./" data-view="resources" class="is-active">Resources</a>
          <a href="../#/about" data-view="about">About</a>
        </nav>
      </div>
    </header>

    <main class="container layer">
      <section class="hero hero--compact">
        <h1 class="hero__title">Resources</h1>
      </section>

      <section>
        <div class="sheet-controls" data-sheet-controls>
          <span class="sheet-controls__label">筛选</span>
          <button class="sheet-filter is-active" type="button" data-filter="默认">默认<span class="sheet-filter__count" data-count="默认"></span></button>
          <button class="sheet-filter" type="button" data-filter="技能">技能<span class="sheet-filter__count" data-count="技能"></span></button>
          <button class="sheet-filter" type="button" data-filter="设计">设计<span class="sheet-filter__count" data-count="设计"></span></button>
          <button class="sheet-filter" type="button" data-filter="工具">工具<span class="sheet-filter__count" data-count="工具"></span></button>
          <button class="sheet-filter" type="button" data-filter="导出">导出<span class="sheet-filter__count" data-count="导出"></span></button>
        </div>

        <div class="sheet" data-sheet>
          <a class="sheet-card" href="skills/e-show-skill.html" data-cats="默认,技能">
            <div class="sheet-card__head"><span class="sheet-card__num">01</span></div>
            <h3 class="sheet-card__title">e-show-skill</h3>
            <p class="sheet-card__desc">skill 介绍页生成器</p>
          </a>

          <a class="sheet-card" href="skills/frontend-slides.html" data-cats="默认,技能,设计">
            <div class="sheet-card__head"><span class="sheet-card__num">02</span></div>
            <h3 class="sheet-card__title">frontend-slides</h3>
            <p class="sheet-card__desc">HTML 幻灯片</p>
          </a>

          <a class="sheet-card" href="skills/e-html-fonts.html" data-cats="默认,技能,工具">
            <div class="sheet-card__head"><span class="sheet-card__num">03</span></div>
            <h3 class="sheet-card__title">e-html-fonts</h3>
            <p class="sheet-card__desc">选区字号编辑</p>
          </a>

          <a class="sheet-card" href="skills/e-html-pdf.html" data-cats="默认,技能,工具,导出">
            <div class="sheet-card__head"><span class="sheet-card__num">04</span></div>
            <h3 class="sheet-card__title">e-html-pdf</h3>

    <footer class="site-footer">
      <div class="container site-footer__inner">
        <div>e-workspace · Resources</div>
        <div>
          <a href="../">← 回首页</a>
          ·
          <a href="https://github.com/jeekeagle/e-workspace" target="_blank" rel="noopener">GitHub</a>
        </div>
      </div>
    </footer>
  </div>

  <script>
    (function () {
      const controls = document.querySelector("[data-sheet-controls]");
      const sheet = document.querySelector("[data-sheet]");
      if (!controls || !sheet) return;

      const filters = Array.from(controls.querySelectorAll("[data-filter]"));
      const cards = Array.from(sheet.querySelectorAll(".sheet-card"));

      const counts = { "默认": cards.length };
      cards.forEach((card) => {
        (card.dataset.cats || "").split(",").map(s => s.trim()).filter(Boolean).forEach((c) => {
          counts[c] = (counts[c] || 0) + 1;
        });
      });

      filters.forEach((btn) => {
        const c = btn.querySelector("[data-count]");
        if (c) c.textContent = "(" + (counts[btn.dataset.filter] || 0) + ")";
      });

      function applyFilter(cat) {
        cards.forEach((card) => {
          const cats = (card.dataset.cats || "").split(",").map(s => s.trim());
          card.classList.toggle("is-hidden", !(cat === "默认" || cats.indexOf(cat) !== -1));
        });
        let empty = sheet.querySelector(".sheet-empty");
        const visible = cards.filter((c) => !c.classList.contains("is-hidden"));
        if (visible.length === 0 && !empty) {
          empty = document.createElement("div");
          empty.className = "sheet-empty";
          empty.textContent = "空";
          sheet.appendChild(empty);
        } else if (empty) {
          empty.remove();
        }
      }

      filters.forEach((btn) => {
        btn.addEventListener("click", () => {
          filters.forEach((b) => b.classList.toggle("is-active", b === btn));
          applyFilter(btn.dataset.filter);
        });
      });
    })();
  </script>
</body>
</html>
